sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/.git/**,**/coverage/**,**/dist/**,**/build/**,**/*.csv,**/client_secret_*.json
sonar.coverage.exclusions=frontend/src/**/*.tsx,frontend/src/**/*.ts
