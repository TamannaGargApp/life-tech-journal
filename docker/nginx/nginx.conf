worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile          on;
  tcp_nopush        on;
  tcp_nodelay       on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_comp_level   6;
  gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  limit_req_zone  $binary_remote_addr zone=api:10m  rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:10m max_size=512m inactive=60m use_temp_path=off;

  add_header X-Frame-Options        "SAMEORIGIN"                      always;
  add_header X-Content-Type-Options "nosniff"                         always;
  add_header X-XSS-Protection       "1; mode=block"                   always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen      443 ssl http2;
    server_name lifetechjournal.com www.lifetechjournal.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    limit_conn conn 20;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass         http://backend:4000;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location ~ ^/api/v1/auth/(login|register) {
      limit_req zone=auth burst=2 nodelay;
      proxy_pass         http://backend:4000;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    location / {
      proxy_pass         http://frontend:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /_next/static/ {
      proxy_pass  http://frontend:3001;
      proxy_cache static;
      proxy_cache_valid 200 365d;
      add_header  Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
